<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMBERDEEP — an endless roguelike descent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #050409; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 150vh); aspect-ratio: 960 / 640; box-shadow: 0 0 60px rgba(255,120,40,0.15); }
  canvas { width: 100%; height: 100%; display: block; background: #07060c; image-rendering: auto; outline: none; }
  noscript { color: #fff; font-family: monospace; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="640" tabindex="0"></canvas></div>
<noscript>EMBERDEEP needs JavaScript enabled.</noscript>
